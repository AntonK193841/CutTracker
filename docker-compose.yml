services:
  postgres:
    image: postgres:16
    container_name: cuttracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cuttracker
      POSTGRES_USER: cuttracker
      POSTGRES_PASSWORD: cuttracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: