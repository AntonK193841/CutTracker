services:
  db:
    image: postgres:16
    container_name: cuttracker-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuttracker}
      POSTGRES_USER: ${POSTGRES_USER:-cuttracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuttracker}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cuttracker} -d ${POSTGRES_DB:-cuttracker}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: cuttracker-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cuttracker:cuttracker@db:5432/cuttracker}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: cuttracker-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: